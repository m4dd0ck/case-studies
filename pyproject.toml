[project]
name = "case-studies"
version = "1.0.0"
description = "Decision memos on public data: a question, a recommendation, the evidence and its limits."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
memos = "case_studies.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/case_studies"]
